<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SúperLista - Compras en Familia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-emerald-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-cart-shopping"></i> SúperLista
            </h1>
            <div class="flex gap-2">
                <button onclick="openModal('importModal')" class="bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-1 shadow-sm">
                    <i class="fa-solid fa-file-import"></i> Importar
                </button>
                <button onclick="openModal('addModal')" class="bg-white text-emerald-700 hover:bg-emerald-50 px-3 py-1.5 rounded-lg text-sm font-semibold transition flex items-center gap-1 shadow-sm">
                    <i class="fa-solid fa-plus"></i> Nuevo
                </button>
            </div>
        </div>
    </header>

    <!-- Progress Bar & Filters -->
    <section class="max-w-md mx-auto w-full px-4 pt-4">
        <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 mb-4">
            <div class="flex justify-between text-xs font-semibold text-slate-500 mb-1">
                <span id="progressText">Progreso: 0 de 0 comprados</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                <div id="progressBar" class="bg-emerald-500 h-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <div class="flex justify-between items-center mt-3 pt-3 border-t border-slate-100 text-xs">
                <label class="flex items-center gap-2 cursor-pointer text-slate-600 select-none">
                    <input type="checkbox" id="showCompletedToggle" onchange="toggleShowCompleted()" class="rounded text-emerald-600 focus:ring-emerald-500 w-4 h-4">
                    Ver completados
                </label>
                <button onclick="sharePending()" class="text-emerald-600 hover:text-emerald-700 font-medium flex items-center gap-1">
                    <i class="fa-brands fa-whatsapp"></i> Enviar pendientes
                </button>
            </div>
        </div>
    </section>

    <!-- Main Content: Categories & Items -->
    <main class="max-w-md mx-auto w-full px-4 flex-grow pb-24" id="categoriesContainer">
        <!-- Se inyecta dinámicamente vía JavaScript -->
    </main>

    <!-- Empty State -->
    <div id="emptyState" class="hidden max-w-md mx-auto w-full px-4 text-center py-12">
        <div class="text-slate-300 text-5xl mb-3"><i class="fa-solid fa-basket-shopping"></i></div>
        <p class="text-slate-500 font-medium">La lista está vacía.</p>
        <p class="text-slate-400 text-sm mt-1">Importá una lista de WhatsApp o agregá productos para empezar.</p>
    </div>

    <!-- Modal Importar de WhatsApp -->
    <div id="importModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-5 shadow-xl animate-in fade-in zoom-in duration-200">
            <h3 class="text-lg font-bold text-slate-800 mb-2 flex items-center gap-2">
                <i class="fa-brands fa-whatsapp text-emerald-600"></i> Importar Lista
            </h3>
            <p class="text-xs text-slate-500 mb-3">Pegá abajo el texto completo que te pasaron por WhatsApp. La app organizará todo automáticamente.</p>
            <textarea id="whatsappInput" rows="6" class="w-full border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50" placeholder="Ej:
LÁCTEOS
- Leche (2)
- Manteca (1)"></textarea>
            <div class="flex justify-end gap-2 mt-4">
                <button onclick="closeModal('importModal')" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-xl font-medium">Cancelar</button>
                <button onclick="processWhatsAppImport()" class="px-4 py-2 text-sm bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-medium shadow-sm">Procesar e Importar</button>
            </div>
        </div>
    </div>

    <!-- Modal Agregar Ítem Manual -->
    <div id="addModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-5 shadow-xl animate-in fade-in zoom-in duration-200">
            <h3 class="text-lg font-bold text-slate-800 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-plus text-emerald-600"></i> Agregar Producto
            </h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre del producto</label>
                    <input type="text" id="addItemName" class="w-full border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50" placeholder="Ej: Harina 0000">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Categoría</label>
                    <select id="addItemCategory" class="w-full border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50">
                        <option value="Lácteos y Refrigerados">Lácteos y Refrigerados</option>
                        <option value="Almacén Dulce">Almacén Dulce</option>
                        <option value="Almacén Salado">Almacén Salado</option>
                        <option value="Limpieza y Perfumería">Limpieza y Perfumería</option>
                        <option value="Frutas y Verduras">Frutas y Verduras</option>
                        <option value="Otros">Otros</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-5">
                <button onclick="closeModal('addModal')" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-xl font-medium">Cancelar</button>
                <button onclick="addItemManual()" class="px-4 py-2 text-sm bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-medium shadow-sm">Guardar</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let items = JSON.parse(localStorage.getItem('superlista_items')) || [
            { id: 1, name: 'Leche líquida deslactosada (6)', category: 'Lácteos y Refrigerados', completed: false },
            { id: 2, name: 'Manteca (4 paquetes)', category: 'Lácteos y Refrigerados', completed: false },
            { id: 3, name: 'Café La Virginia Selección (2)', category: 'Almacén Dulce', completed: false },
            { id: 4, name: 'Aceite botellón grande (2)', category: 'Almacén Salado', completed: false },
            { id: 5, name: 'Jabón para ropa Granby', category: 'Limpieza y Perfumería', completed: false }
        ];

        let showCompleted = false;

        function saveAndRender() {
            localStorage.setItem('superlista_items', JSON.stringify(items));
            renderList();
        }

        function toggleShowCompleted() {
            showCompleted = document.getElementById('showCompletedToggle').checked;
            renderList();
        }

        function toggleItem(id) {
            const item = items.find(i => i.id === id);
            if (item) {
                item.completed = !item.completed;
                saveAndRender();
            }
        }

        function deleteItem(id) {
            items = items.filter(i => i.id !== id);
            saveAndRender();
        }

        function openModal(modalId) {
            document.getElementById(modalId).classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        function renderList() {
            const container = document.getElementById('categoriesContainer');
            const emptyState = document.getElementById('emptyState');
            container.innerHTML = '';

            if (items.length === 0) {
                emptyState.classList.remove('hidden');
                updateProgress();
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            // Agrupar por categoría
            const grouped = {};
            items.forEach(item => {
                if (!showCompleted && item.completed) return;
                if (!grouped[item.category]) {
                    grouped[item.category] = [];
                }
                grouped[item.category].push(item);
            });

            if (Object.keys(grouped).length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-slate-400 text-sm">No hay ítems pendientes visibles.<br>Activá "Ver completados" arriba.</div>';
                updateProgress();
                return;
            }

            for (const [category, catItems] of Object.entries(grouped)) {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'mb-5';
                
                let html = `<h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2 px-1">${category}</h2>`;
                html += `<div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden divide-y divide-slate-100">`;

                catItems.forEach(item => {
                    html = html + `
                        <div class="flex items-center justify-between p-3.5 transition hover:bg-slate-50/80 ${item.completed ? 'bg-slate-50/50 opacity-60' : ''}">
                            <div class="flex items-center gap-3 cursor-pointer flex-grow select-none" onclick="toggleItem(${item.id})">
                                <div class="w-6 h-6 rounded-lg border-2 flex items-center justify-center transition ${item.completed ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 bg-white'}">
                                    ${item.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                                </div>
                                <span class="text-sm font-medium ${item.completed ? 'line-through text-slate-400' : 'text-slate-700'}">${item.name}</span>
                            </div>
                            <button onclick="deleteItem(${item.id})" class="text-slate-300 hover:text-rose-500 p-2 transition"><i class="fa-solid fa-trash-can text-xs"></i></button>
                        </div>
                    `;
                });

                html += `</div>`;
                categoryDiv.innerHTML = html;
                container.appendChild(categoryDiv);
            }

            updateProgress();
        }

        function updateProgress() {
            const total = items.length;
            const completed = items.filter(i => i.completed).length;
            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('progressText').innerText = `Progreso: ${completed} de ${total} comprados`;
            document.getElementById('progressPercent').innerText = `${percent}%`;
            document.getElementById('progressBar').style.width = `${percent}%`;
        }

        function addItemManual() {
            const nameInput = document.getElementById('addItemName');
            const categorySelect = document.getElementById('addItemCategory');
            const name = nameInput.value.trim();

            if (!name) return;

            items.push({
                id: Date.now(),
                name: name,
                category: categorySelect.value,
                completed: false
            });

            nameInput.value = '';
            closeModal('addModal');
            saveAndRender();
        }

        function processWhatsAppImport() {
            const text = document.getElementById('whatsappInput').value.trim();
            if (!text) return;

            const lines = text.split('\n');
            let currentCategory = 'Otros';

            lines.forEach(line => {
                let cleanLine = line.trim();
                if (!cleanLine) return;

                // Detectar si es un encabezado (por ejemplo, en mayúsculas o sin guiones)
                if (cleanLine === cleanLine.toUpperCase() && cleanLine.length > 3 && !cleanLine.includes('-') && !cleanLine.includes('•')) {
                    currentCategory = capitalizeFirst(cleanLine.toLowerCase());
                    return;
                }

                // Limpiar viñetas comunes
                cleanLine = cleanLine.replace(/^[-*•]\s*/, '').trim();
                if (cleanLine) {
                    items.push({
                        id: Date.now() + Math.random(),
                        name: cleanLine,
                        category: currentCategory,
                        completed: false
                    });
                }
            });

            document.getElementById('whatsappInput').value = '';
            closeModal('importModal');
            saveAndRender();
        }

        function capitalizeFirst(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        function sharePending() {
            const pending = items.filter(i => !i.completed);
            if (pending.length === 0) {
                alert('¡No quedan productos pendientes!');
                return;
            }

            let text = '🛒 *Lista de compras pendiente:*\n\n';
            let currentCat = '';

            pending.forEach(item => {
                if (item.category !== currentCat) {
                    currentCat = item.category;
                    text += `\n*${currentCat}*\n`;
                }
                text += `- ${item.name}\n`;
            });

            const encoded = encodeURIComponent(text);
            window.open(`https://api.whatsapp.com/send?text=${encoded}`, '_blank');
        }

        // Inicializar al cargar
        renderList();
    </script>
</body>
</html>
